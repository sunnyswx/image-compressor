<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">图片压缩工具 - 免费在线压缩PNG、JPG、WebP</title>
    <meta name="description" content="免费在线图片压缩工具，支持PNG、JPG、WebP格式压缩，无需上传服务器，本地处理保护隐私">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header { 
            text-align: center; 
            padding: 40px 20px;
            color: white;
        }
        header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        header p { font-size: 1.2rem; opacity: 0.9; }
        
        /* 语言切换器 */
        .lang-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        .lang-switcher select {
            padding: 10px 15px;
            border-radius: 25px;
            border: none;
            background: white;
            color: #333;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .ad-banner { 
            background: rgba(255,255,255,0.1);
            border: 2px dashed rgba(255,255,255,0.3);
            padding: 30px;
            margin: 20px 0;
            text-align: center;
            color: white;
            border-radius: 10px;
        }
        
        .tool-card { 
            background: white;
            border-radius: 20px;
            padding: 40px;
            margin: 20px 0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9fa;
        }
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f0f0;
        }
        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8e8ff;
        }
        .upload-area.has-image {
            padding: 20px;
        }
        .upload-icon { font-size: 4rem; margin-bottom: 20px; }
        .upload-text { font-size: 1.2rem; color: #666; }
        
        #fileInput { display: none; }
        
        /* 图片预览区 */
        .preview-container {
            display: none;
            margin: 20px 0;
            text-align: center;
        }
        .preview-container.show { display: block; }
        .preview-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .file-info {
            margin-top: 15px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
            font-size: 14px;
            color: #666;
        }
        
        .controls {
            margin: 30px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .controls label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
        }
        .controls input[type="range"] {
            width: 100%;
            margin: 10px 0;
        }
        .quality-value {
            display: inline-block;
            padding: 5px 15px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-weight: bold;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 10px;
        }
        .btn:hover { transform: scale(1.05); }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 10px;
            display: none;
        }
        .result.show { display: block; }
        .result h3 { color: #2e7d32; margin-bottom: 15px; }
        .stats {
            display: flex;
            gap: 30px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }
        .stat-save {
            color: #4caf50;
        }
        
        /* 对比图 */
        .comparison {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .comparison-item {
            flex: 1;
            min-width: 200px;
            text-align: center;
        }
        .comparison-item img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .comparison-label {
            margin-top: 10px;
            font-weight: bold;
            color: #333;
        }
        
        footer {
            text-align: center;
            padding: 40px 20px;
            color: white;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <!-- 语言切换器 -->
    <div class="lang-switcher">
        <select id="langSelect" onchange="changeLanguage(this.value)">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
        </select>
    </div>
    
    <div class="container">
        <header>
            <h1>🛠️ <span data-i18n="title">图片压缩工具</span></h1>
            <p data-i18n="subtitle">免费在线压缩PNG、JPG、WebP图片，无需上传服务器，本地处理保护隐私</p>
        </header>
        
        <div class="ad-banner">
            <p>📢 <span data-i18n="ad1">广告位 - Google AdSense</span></p>
        </div>
        
        <div class="tool-card">
            <h2 data-i18n="uploadTitle">上传图片并压缩</h2>
            
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <div class="upload-text" data-i18n="uploadText">点击上传或拖拽图片到此处</div>
                <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp">
            </div>
            
            <!-- 图片预览 -->
            <div class="preview-container" id="previewContainer">
                <img id="previewImage" class="preview-image" src="" alt="预览">
                <div class="file-info" id="fileInfo"></div>
            </div>
            
            <div class="controls" id="controls" style="display: none;">
                <label>
                    <span data-i18n="quality">压缩质量</span>：
                    <span class="quality-value" id="qualityValue">80%</span>
                    <input type="range" id="qualitySlider" min="1" max="100" value="80">
                </label>
                <button class="btn" id="compressBtn" data-i18n="compressBtn">开始压缩</button>
            </div>
            
            <!-- 对比图 -->
            <div class="comparison" id="comparison" style="display: none;">
                <div class="comparison-item">
                    <img id="originalImage" src="" alt="原始图片">
                    <div class="comparison-label" data-i18n="original">原始图片</div>
                </div>
                <div class="comparison-item">
                    <img id="compressedImage" src="" alt="压缩图片">
                    <div class="comparison-label" data-i18n="compressed">压缩后</div>
                </div>
            </div>
            
            <div class="result" id="result">
                <h3>✅ <span data-i18n="compressSuccess">压缩完成！</span></h3>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="originalSize">-</div>
                        <div class="stat-label" data-i18n="originalSize">原始大小</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="compressedSize">-</div>
                        <div class="stat-label" data-i18n="compressedSize">压缩后大小</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value stat-save" id="savePercent">-</div>
                        <div class="stat-label" data-i18n="savePercent">节省空间</div>
                    </div>
                </div>
                <a id="downloadLink" class="btn" download="compressed-image.jpg" data-i18n="downloadBtn">下载压缩图片</a>
            </div>
        </div>
        
        <div class="ad-banner">
            <p>📢 <span data-i18n="ad2">广告位 - Google AdSense</span></p>
        </div>
        
        <footer>
            <p>© 2026 <span data-i18n="footer">Image Compressor | 免费在线工具</span></p>
        </footer>
    </div>
    
    <script>
        // 多语言配置
        const i18n = {
            zh: {
                title: "图片压缩工具",
                subtitle: "免费在线压缩PNG、JPG、WebP图片，无需上传服务器，本地处理保护隐私",
                ad1: "广告位 - Google AdSense",
                ad2: "广告位 - Google AdSense",
                uploadTitle: "上传图片并压缩",
                uploadText: "点击上传或拖拽图片到此处",
                quality: "压缩质量",
                compressBtn: "开始压缩",
                compressing: "压缩中...",
                compressSuccess: "压缩完成！",
                original: "原始图片",
                compressed: "压缩后",
                originalSize: "原始大小",
                compressedSize: "压缩后大小",
                savePercent: "节省空间",
                downloadBtn: "下载压缩图片",
                footer: "Image Compressor | 免费在线工具",
                fileInfo: "文件名: {name} | 大小: {size} | 类型: {type}",
                noImage: "请先上传图片"
            },
            en: {
                title: "Image Compressor",
                subtitle: "Free online PNG, JPG, WebP image compressor. Process locally without uploading to server, protecting your privacy.",
                ad1: "Advertisement Space - Google AdSense",
                ad2: "Advertisement Space - Google AdSense",
                uploadTitle: "Upload and Compress Image",
                uploadText: "Click to upload or drag image here",
                quality: "Compression Quality",
                compressBtn: "Compress Now",
                compressing: "Compressing...",
                compressSuccess: "Compression Complete!",
                original: "Original",
                compressed: "Compressed",
                originalSize: "Original Size",
                compressedSize: "Compressed Size",
                savePercent: "Saved",
                downloadBtn: "Download Compressed Image",
                footer: "Image Compressor | Free Online Tool",
                fileInfo: "Name: {name} | Size: {size} | Type: {type}",
                noImage: "Please upload an image first"
            },
            ja: {
                title: "画像圧縮ツール",
                subtitle: "PNG、JPG、WebP画像をオンラインで無料で圧縮。サーバーにアップロードせず、ローカルで処理してプライバシーを保護。",
                ad1: "広告スペース - Google AdSense",
                ad2: "広告スペース - Google AdSense",
                uploadTitle: "画像をアップロードして圧縮",
                uploadText: "クリックしてアップロードまたはここにドラッグ",
                quality: "圧縮品質",
                compressBtn: "圧縮開始",
                compressing: "圧縮中...",
                compressSuccess: "圧縮完了！",
                original: "元画像",
                compressed: "圧縮後",
                originalSize: "元のサイズ",
                compressedSize: "圧縮後サイズ",
                savePercent: "節約率",
                downloadBtn: "圧縮画像をダウンロード",
                footer: "Image Compressor | フリーオンラインツール",
                fileInfo: "名前: {name} | サイズ: {size} | 形式: {type}",
                noImage: "まず画像をアップロードしてください"
            },
            ko: {
                title: "이미지 압축 도구",
                subtitle: "PNG, JPG, WebP 이미지를 무료로 온라인 압축. 서버에 업로드하지 않고 로컬에서 처리하여 개인 정보를 보호합니다.",
                ad1: "광고 공간 - Google AdSense",
                ad2: "광고 공간 - Google AdSense",
                uploadTitle: "이미지 업로드 및 압축",
                uploadText: "클릭하여 업로드하거나 여기로 드래그",
                quality: "압축 품질",
                compressBtn: "압축 시작",
                compressing: "압축 중...",
                compressSuccess: "압축 완료!",
                original: "원본",
                compressed: "압축 후",
                originalSize: "원본 크기",
                compressedSize: "압축 후 크기",
                savePercent: "절약률",
                downloadBtn: "압축 이미지 다운로드",
                footer: "Image Compressor | 무료 온라인 도구",
                fileInfo: "이름: {name} | 크기: {size} | 타입: {type}",
                noImage: "먼저 이미지를 업로드하세요"
            },
            es: {
                title: "Compresor de Imágenes",
                subtitle: "Comprime imágenes PNG, JPG, WebP en línea gratis. Procesa localmente sin subir al servidor, protegiendo tu privacidad.",
                ad1: "Espacio publicitario - Google AdSense",
                ad2: "Espacio publicitario - Google AdSense",
                uploadTitle: "Subir y comprimir imagen",
                uploadText: "Haz clic para subir o arrastra la imagen aquí",
                quality: "Calidad de compresión",
                compressBtn: "Comprimir ahora",
                compressing: "Comprimiendo...",
                compressSuccess: "¡Compresión completada!",
                original: "Original",
                compressed: "Comprimido",
                originalSize: "Tamaño original",
                compressedSize: "Tamaño comprimido",
                savePercent: "Ahorro",
                downloadBtn: "Descargar imagen comprimida",
                footer: "Compresor de Imágenes | Herramienta gratuita en línea",
                fileInfo: "Nombre: {name} | Tamaño: {size} | Tipo: {type}",
                noImage: "Por favor sube una imagen primero"
            },
            fr: {
                title: "Compresseur d'Images",
                subtitle: "Compressez gratuitement vos images PNG, JPG, WebP en ligne. Traitez localement sans télécharger sur le serveur, protégez votre vie privée.",
                ad1: "Espace publicitaire - Google AdSense",
                ad2: "Espace publicitaire - Google AdSense",
                uploadTitle: "Télécharger et compresser",
                uploadText: "Cliquez pour télécharger ou glissez l'image ici",
                quality: "Qualité de compression",
                compressBtn: "Compresser maintenant",
                compressing: "Compression...",
                compressSuccess: "Compression terminée!",
                original: "Original",
                compressed: "Compressé",
                originalSize: "Taille originale",
                compressedSize: "Taille compressée",
                savePercent: "Économisé",
                downloadBtn: "Télécharger l'image compressée",
                footer: "Compresseur d'Images | Outil gratuit en ligne",
                fileInfo: "Nom: {name} | Taille: {size} | Type: {type}",
                noImage: "Veuillez d'abord télécharger une image"
            }
        };
        
        let currentLang = 'zh';
        let currentFile = null;
        
        // 检测浏览器语言
        function detectLanguage() {
            const browserLang = navigator.language || navigator.userLanguage;
            const langMap = {
                'zh': 'zh', 'zh-CN': 'zh', 'zh-TW': 'zh',
                'en': 'en', 'en-US': 'en', 'en-GB': 'en',
                'ja': 'ja', 'ja-JP': 'ja',
                'ko': 'ko', 'ko-KR': 'ko',
                'es': 'es', 'es-ES': 'es',
                'fr': 'fr', 'fr-FR': 'fr'
            };
            return langMap[browserLang] || 'en';
        }
        
        // 切换语言
        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById('langSelect').value = lang;
            
            // 更新所有文本
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang] && i18n[lang][key]) {
                    el.textContent = i18n[lang][key];
                }
            });
            
            // 更新标题
            document.title = i18n[lang].title + (lang === 'zh' ? ' - 免费在线工具' : ' - Free Online Tool');
            
            // 更新文件信息
            if (currentFile) {
                updateFileInfo();
            }
        }
        
        // 初始化语言
        function initLanguage() {
            currentLang = detectLanguage();
            document.getElementById('langSelect').value = currentLang;
            changeLanguage(currentLang);
        }
        
        // 更新文件信息显示
        function updateFileInfo() {
            if (!currentFile) return;
            const info = i18n[currentLang].fileInfo
                .replace('{name}', currentFile.name)
                .replace('{size}', formatBytes(currentFile.size))
                .replace('{type}', currentFile.type.split('/')[1].toUpperCase());
            document.getElementById('fileInfo').textContent = info;
        }
        
        // 格式化文件大小
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        // 初始化
        initLanguage();
        
        // 上传相关
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const controls = document.getElementById('controls');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const qualitySlider = document.getElementById('qualitySlider');
        const qualityValue = document.getElementById('qualityValue');
        const compressBtn = document.getElementById('compressBtn');
        const result = document.getElementById('result');
        const comparison = document.getElementById('comparison');
        
        // 点击上传
        uploadArea.addEventListener('click', () => fileInput.click());
        
        // 文件选择
        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                handleFile(e.target.files[0]);
            }
        });
        
        // 处理文件
        function handleFile(file) {
            currentFile = file;
            
            // 显示预览
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewContainer.classList.add('show');
                uploadArea.classList.add('has-image');
                controls.style.display = 'block';
                result.classList.remove('show');
                comparison.style.display = 'none';
                updateFileInfo();
            };
            reader.readAsDataURL(file);
        }
        
        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
                fileInput.files = e.dataTransfer.files;
            }
        });
        
        // 质量滑块
        qualitySlider.addEventListener('input', (e) => {
            qualityValue.textContent = e.target.value + '%';
        });
        
        // 压缩图片
        compressBtn.addEventListener('click', async () => {
            if (!currentFile) {
                alert(i18n[currentLang].noImage);
                return;
            }
            
            compressBtn.disabled = true;
            compressBtn.textContent = i18n[currentLang].compressing;
            
            try {
                const quality = parseInt(qualitySlider.value) / 100;
                
                // 创建图片元素
                const img = new Image();
                img.src = previewImage.src;
                
                await new Promise((resolve) => {
                    img.onload = resolve;
                });
                
                // 创建canvas并压缩
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                canvas.toBlob((blob) => {
                    const compressedUrl = URL.createObjectURL(blob);
                    const compressedSize = blob.size;
                    const originalSize = currentFile.size;
                    const savePercent = ((originalSize - compressedSize) / originalSize * 100).toFixed(1);
                    
                    // 更新统计
                    document.getElementById('originalSize').textContent = formatBytes(originalSize);
                    document.getElementById('compressedSize').textContent = formatBytes(compressedSize);
                    document.getElementById('savePercent').textContent = savePercent + '%';
                    
                    // 更新下载链接
                    const downloadLink = document.getElementById('downloadLink');
                    downloadLink.href = compressedUrl;
                    downloadLink.download = 'compressed-image.jpg';
                    
                    // 显示对比图
                    document.getElementById('originalImage').src = previewImage.src;
                    document.getElementById('compressedImage').src = compressedUrl;
                    comparison.style.display = 'flex';
                    
                    result.classList.add('show');
                    compressBtn.disabled = false;
                    compressBtn.textContent = i18n[currentLang].compressBtn;
                }, 'image/jpeg', quality);
                
            } catch (error) {
                console.error('压缩失败:', error);
                alert(i18n[currentLang].noImage);
                compressBtn.disabled = false;
                compressBtn.textContent = i18n[currentLang].compressBtn;
            }
        });
    </script>
</body>
</html>
